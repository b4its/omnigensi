# Override untuk mode production.
# Pakai bersamaan:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    restart: always
    # Port DB tidak di-expose ke host pada production demi keamanan
    ports: []

  redis:
    restart: always
    ports: []

  backend:
    build:
      target: production
    restart: always
    volumes:
      - omnigensi_workspace:/app/workspace

  frontend:
    build:
      target: production
    restart: always
    volumes: []
